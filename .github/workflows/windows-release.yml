name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check src tests scripts
      - run: pyinstaller --onefile --name CoCBot --paths src scripts/cocbot_entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: CoCBot-Windows
          path: dist/CoCBot.exe
