name: Windows build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - "pyproject.toml"
      - "src/**"
      - "scripts/**"
      - "tests/**"
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check src tests scripts
      - run: pyinstaller --onefile --name CoCBot --paths src --collect-data rapidocr_onnxruntime --collect-binaries onnxruntime scripts/cocbot_entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: CoCBot-Windows
          path: dist/CoCBot.exe
