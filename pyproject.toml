[project]
name = "coc-autonomous-bot"
version = "0.1.0"
description = "Experimental game automation controller"
requires-python = ">=3.11"
dependencies = ["opencv-python>=4.10","numpy>=2.0","Pillow>=10.0","PyYAML>=6.0"]

[project.scripts]
cocbot = "cocbot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0","ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
